
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- Strips Referrer to bypass Google TTS API 403 Forbidden inside Iframe / Shared Folders -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>咱來縛肉粽與礤冰！- 台灣傳統美食台語互動體驗</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti for winning animation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #FAF2E5; /* Warm sand/rice background color from screenshot */
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.4s ease;
    }
    body.shaved-ice-mode {
      background-color: #EBF5FB; /* Ice cool light blue background */
    }
    .screenshot-card-shadow {
      box-shadow: 0 4px 12px rgba(139, 115, 85, 0.08);
      border: 1px solid rgba(226, 210, 181, 0.4);
      transition: all 0.4s ease;
    }
    body.shaved-ice-mode .screenshot-card-shadow {
      box-shadow: 0 4px 12px rgba(135, 206, 250, 0.15);
      border-color: rgba(186, 220, 243, 0.6);
    }
    .drag-item {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .drag-item:hover .control-ring {
      opacity: 1;
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    .swing-decoration {
      animation: swing 3s ease-in-out infinite;
      transform-origin: top center;
    }
    /* Cold vapor steam animation for ice */
    @keyframes ice-steam {
      0% { transform: translateY(5px) scale(0.9); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: translateY(-15px) scale(1.1); opacity: 0; }
    }
    .ice-vapor {
      animation: ice-steam 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen py-4 px-3 flex flex-col items-center justify-start select-none">

  <!-- MAIN WRAPPER CONTAINER -->
  <div class="w-full max-w-md bg-[#F5EFE4] rounded-[28px] overflow-hidden border-4 border-[#1E5136] shadow-2xl flex flex-col pb-6 transition-all duration-400" id="main-container">
    
    <!-- MODE SWITCHER TABS (At the very top) -->
    <div class="flex border-b-4 border-[#123623] bg-[#123623] p-1" id="tab-bar">
      <button id="tab-zongzi" class="flex-1 py-2 text-center font-black text-xs md:text-sm rounded-t-xl transition-all duration-300 bg-[#1E5136] text-[#FDF03A] border-b-2 border-[#FDF03A]">
        🍙 咱來縛肉粽！
      </button>
      <button id="tab-ice" class="flex-1 py-2 text-center font-black text-xs md:text-sm rounded-t-xl transition-all duration-300 bg-[#123623] text-slate-400 hover:text-white">
        🍧 咱來礤冰！
      </button>
    </div>

    <!-- HEADER TITLE BAR -->
    <header class="bg-[#1E5136] py-3 px-4 flex items-center justify-center space-x-2 text-white transition-colors duration-400" id="header-bar">
      <span class="text-xl" id="header-icon">📐</span>
      <h1 class="text-lg font-black tracking-widest text-[#FDF8F0]" id="header-title">咱來縛肉粽！</h1>
    </header>

    <!-- MAIN SCROLLABLE BODY -->
    <div class="px-3 pt-4 space-y-4 flex-1">
      
      <!-- PART 1: INGREDIENTS SELECTOR (壹、澎湃的料) -->
      <section class="bg-[#FFFDF9] rounded-2xl p-4 screenshot-card-shadow relative">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span class="text-lg" id="panel-one-icon">🍱</span>
            <h2 class="text-base font-bold text-[#1E5136] transition-colors" id="panel-one-title">壹、澎湃的料</h2>
          </div>
          <span class="bg-[#F2DF3A] text-[#1E5136] text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm" id="engine-badge">
            🔊 雲端台語 (Google)
          </span>
        </div>

        <!-- Grid dynamically populated via JS (Switches between Zongzi and Ice ingredients) -->
        <div class="grid grid-cols-2 gap-3" id="ingredients-grid"></div>

        <!-- Yellow banner instructions -->
        <div class="bg-[#FFFDEB] border border-[#FDEAA8] rounded-xl p-2.5 text-[11px] text-[#8B6B3F] mt-3.5 flex items-start space-x-1.5 leading-relaxed" id="banner-tips">
          <span class="text-sm mt-0.5">💡</span>
          <p id="tip-text">
            你可以簡單 <strong>[- / +]</strong> 放入配料，並直接在下方粽葉上“任意調整和旋轉”它的位置唷！
          </p>
        </div>
      </section>

      <!-- PART 2: THE PLAYGROUND CANVAS -->
      <section class="bg-white rounded-2xl p-4 screenshot-card-shadow relative flex flex-col">
        
        <!-- Canvas Frame -->
        <div id="canvas-area" class="w-full h-64 bg-gradient-to-b from-slate-50 to-emerald-50/20 rounded-xl border border-dashed border-[#D6C7AE] relative overflow-hidden flex items-center justify-center">
          
          <!-- Tutorial Tooltip Bubble -->
          <div id="canvas-hint" class="absolute top-3 left-3 right-3 bg-white/95 backdrop-blur-sm border border-emerald-100 px-3 py-1.5 rounded-full text-center text-[10px] text-emerald-800 shadow-sm z-30 pointer-events-none transition-opacity duration-300">
            👉 請點選上方配料 <strong>[ + ]</strong> 放入肉粽葉中！
          </div>

          <!-- UNWRAPPED STATE (Dynamic background container) -->
          <div id="unwrapped-state" class="relative w-full h-full flex items-center justify-center transition-all duration-300">
            <!-- Leaf SVG or Bowl SVG dynamically loaded here -->
            <div id="canvas-bg-graphic" class="w-full h-full flex items-center justify-center"></div>

            <!-- Container for Draggable Spawn Emojis -->
            <div id="spawning-container" class="absolute inset-0 z-20"></div>
          </div>

          <!-- WRAPPED STATE (Pyramid Zongzi or Condensed Milk Ice mound) -->
          <div id="wrapped-state" class="hidden absolute inset-0 w-full h-full flex flex-col items-center justify-center bg-[#F4F9FB] transition-all duration-300">
            <!-- 3D Graphic placeholder -->
            <div id="completed-graphic" class="relative w-36 h-36 flex items-center justify-center"></div>
            <!-- Ribbon Pill Badge -->
            <span class="mt-3 bg-[#729A82] text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm flex items-center space-x-1 transition-colors" id="wrapped-badge">
              <span>✨</span> <span id="wrapped-badge-text">縛好矣！芳貢貢！</span>
            </span>
          </div>

          <!-- Decorative Hanger (Bottom right swing toy) -->
          <div class="absolute bottom-2.5 right-2.5 flex flex-col items-center pointer-events-none z-10">
            <div class="w-4 h-0.5 bg-amber-800 rounded-sm" id="hanger-top"></div>
            <div class="w-0.5 h-5 bg-amber-700" id="hanger-string"></div>
            <div class="swing-decoration -mt-0.5" id="mini-swing-toy">
              <!-- Dynamically populated mini hanging SVG -->
            </div>
          </div>

        </div>

        <!-- Buttons Block: Styled exactly like screenshot -->
        <div class="grid grid-cols-2 gap-3 mt-4">
          <!-- Restart Button -->
          <button id="btn-restart" class="bg-[#5A6C7C] hover:bg-[#4E5E6D] text-white font-bold py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-md active:scale-95 transition-all">
            <span class="text-base">🔀</span>
            <span class="text-sm tracking-wide">重新來過</span>
          </button>
          
          <!-- Finish/Wrap Button -->
          <button id="btn-finish" class="bg-[#F36F21] hover:bg-[#E25E12] text-white font-black py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-md active:scale-95 transition-all transition-colors duration-400">
            <span class="text-base" id="finish-icon">🍙</span>
            <span id="finish-text" class="text-sm tracking-wide">我綁好矣！</span>
          </button>
        </div>

      </section>

      <!-- PART 3: SPEECH AREA (參、講看覓咧！) -->
      <section class="bg-[#1E5136] rounded-2xl p-4 border-2 border-[#123623] text-white screenshot-card-shadow transition-colors duration-400" id="speech-section">
        
        <!-- Header -->
        <div class="flex items-center space-x-2 mb-3">
          <span class="text-lg">🗣️</span>
          <h2 class="text-sm font-black text-white">參、講看覓咧！<span class="text-[11px] text-emerald-200 font-normal ml-1" id="speech-sub">（用台語介紹肉粽內底有啥）</span></h2>
        </div>

        <!-- Speech Frame Container (Dark Green Pill Box) -->
        <div class="bg-[#17432C] rounded-2xl p-3.5 flex items-center space-x-4 border border-[#123522] transition-colors duration-400" id="speech-box">
          
          <!-- Circular Speaker/Microphone Trigger Button -->
          <button id="btn-speak-all" class="w-12 h-12 shrink-0 bg-white hover:bg-emerald-50 text-[#1E5136] rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform relative" title="點擊聆聽台語發音">
            <i class="fa-solid fa-microphone text-lg text-emerald-800" id="mic-icon"></i>
          </button>

          <!-- Speech Text content -->
          <div class="flex-1 min-h-[48px] flex flex-col justify-center">
            <span class="text-[10px] text-emerald-300 font-bold tracking-wider mb-0.5" id="speech-prefix">這是我的肉粽，我的肉粽內底有：</span>
            <!-- Bright Yellow Text from Screenshot 2 -->
            <div id="speech-sentence" class="text-sm md:text-base font-black text-[#FDF03A] tracking-wide leading-relaxed">
              (請點選上方配料 + 放入肉粽裡...)
            </div>
          </div>

        </div>

      </section>

    </div>
  </div>

  <div class="text-[10px] text-slate-400 mt-4 text-center select-none font-medium" id="page-footer">
    咱來縛肉粽與礤冰！ | 採用 100% 正統台語原生發音技術 (`nan-TW`)
  </div>

  <!-- APPLICATION CODE LOGIC -->
  <script>
    // 1. Dual Mode Datasets Definition
    const zongziIngredients = [
      { id: 'yolk', name: '卵仁', sub: 'nn̂g-jîn', emoji: '🟡', spName: '卵仁' },
      { id: 'mushroom', name: '香菇', sub: 'hiunn-koo', emoji: '🍄', spName: '香菇' },
      { id: 'peanut', name: '塗豆', sub: 'thôo-tāu', emoji: '🥜', spName: '土豆' },
      { id: 'pork', name: '滷肉', sub: 'lóo-bah', emoji: '🥓', spName: '魯肉' },
      { id: 'chestnut', name: '栗子', sub: 'la̍t-tsí', emoji: '🌰', spName: '栗子' },
      { id: 'shrimp', name: '蝦米', sub: 'hê-bí', emoji: '🦐', spName: '蝦米' },
      { id: 'squid', name: '魷魚', sub: 'jiû-hî', emoji: '🦑', spName: '魷魚' },
      { id: 'salted_egg', name: '鹹蛋', sub: 'kiâm-nn̂g', emoji: '🍳', spName: '鹹蛋' }
    ];

    const shavedIceIngredients = [
      { id: 'redbean', name: '紅豆', sub: 'âng-tāu', emoji: '🔴', spName: '紅豆' },
      { id: 'mungbean', name: '綠豆', sub: 'li̍k-tāu', emoji: '🟢', spName: '綠豆' },
      { id: 'pearl', name: '粉圓', sub: 'hún-înn', emoji: '⚫', spName: '粉圓' },
      { id: 'taroball', name: '芋圓', sub: 'ōo-înn', emoji: '🍠', spName: '芋圓' },
      { id: 'aiyu', name: '愛玉', sub: 'ài-io̍k', emoji: '🟡', spName: '愛玉' },
      { id: 'grassjelly', name: '仙草', sub: 'sian-tsháu', emoji: '🖤', spName: '仙草' },
      { id: 'pinkkui', name: '粉粿', sub: 'hún-kué', emoji: '🟨', spName: '粉粿' },
      { id: 'condensed', name: '煉乳', sub: 'liān-ling', emoji: '🥛', spName: '煉乳' }
    ];

    // Current State Registry
    let currentMode = 'zongzi'; // 'zongzi' or 'shavedIce'
    let basket = {};            // Stores dynamic quantities for current mode
    let canvasItems = [];       // Array of draggable objects in the canvas
    let isWrapped = false;
    let activeAudio = null;     
    let isAudioUnlocked = false;

    // DOM selectors
    const mainContainer = document.getElementById('main-container');
    const headerBar = document.getElementById('header-bar');
    const headerIcon = document.getElementById('header-icon');
    const headerTitle = document.getElementById('header-title');
    const panelOneIcon = document.getElementById('panel-one-icon');
    const panelOneTitle = document.getElementById('panel-one-title');
    const gridEl = document.getElementById('ingredients-grid');
    const tipText = document.getElementById('tip-text');
    const canvasHint = document.getElementById('canvas-hint');
    const spawnContainer = document.getElementById('spawning-container');
    const canvasBgGraphic = document.getElementById('canvas-bg-graphic');
    const completedGraphic = document.getElementById('completed-graphic');
    const unwrappedState = document.getElementById('unwrapped-state');
    const wrappedState = document.getElementById('wrapped-state');
    const wrappedBadge = document.getElementById('wrapped-badge');
    const wrappedBadgeText = document.getElementById('wrapped-badge-text');
    const miniSwingToy = document.getElementById('mini-swing-toy');
    const finishText = document.getElementById('finish-text');
    const finishIcon = document.getElementById('finish-icon');
    const speechSection = document.getElementById('speech-section');
    const speechSub = document.getElementById('speech-sub');
    const speechBox = document.getElementById('speech-box');
    const speechPrefix = document.getElementById('speech-prefix');
    const speechSentenceEl = document.getElementById('speech-sentence');
    const micIcon = document.getElementById('mic-icon');
    const engineBadge = document.getElementById('engine-badge');

    // Controls Action Listeners
    const btnRestart = document.getElementById('btn-restart');
    const btnFinish = document.getElementById('btn-finish');
    const btnSpeakAll = document.getElementById('btn-speak-all');

    // 2. Initialize App
    function init() {
      // Set initial mode layout
      switchMode('zongzi');

      // Binds standard Pointer events to avoid touchscreen / standard mouse clicks conflict on laptop
      btnRestart.addEventListener('pointerdown', restartAction);
      btnFinish.addEventListener('pointerdown', toggleWrapState);
      btnSpeakAll.addEventListener('pointerdown', () => {
        unlockAudioPipeline();
        playFullSpeechSentence();
      });

      // Tab Swapping programmatic binding (Stops laptop sandboxed inline security blocks)
      const tabZongziBtn = document.getElementById('tab-zongzi');
      const tabIceBtn = document.getElementById('tab-ice');
      tabZongziBtn.addEventListener('pointerdown', () => switchMode('zongzi'));
      tabIceBtn.addEventListener('pointerdown', () => switchMode('shavedIce'));

      // Quick-unlock trigger on first tap
      window.addEventListener('pointerdown', unlockAudioPipeline, { passive: true });
    }

    // iOS Audio playback unlock mechanism
    function unlockAudioPipeline() {
      if (isAudioUnlocked) return;
      try {
        const dummy = new Audio();
        dummy.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
        dummy.play().then(() => {
          isAudioUnlocked = true;
          console.log("Audio pipeline successfully unlocked");
        }).catch(() => {});
      } catch (e) {}
    }

    // 3. SWITCH MODE: Transitions between Zongzi and Shaved Ice Theme Layouts
    window.switchMode = function(mode) {
      // Stop ongoing voice playback
      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      currentMode = mode;
      basket = {};
      canvasItems = [];
      spawnContainer.innerHTML = '';
      isWrapped = false;

      // Update Tab CSS
      const tabZongzi = document.getElementById('tab-zongzi');
      const tabIce = document.getElementById('tab-ice');

      if (mode === 'zongzi') {
        // Zongzi Mode styling (Forest Green)
        document.body.classList.remove('shaved-ice-mode');
        mainContainer.className = "w-full max-w-md bg-[#F5EFE4] rounded-[28px] overflow-hidden border-4 border-[#1E5136] shadow-2xl flex flex-col pb-6 transition-all duration-400";
        headerBar.className = "bg-[#1E5136] py-3.5 px-4 flex items-center justify-center space-x-2 text-white transition-all duration-400";
        headerIcon.innerText = "🍙";
        headerTitle.innerText = "咱來縛肉粽！";
        panelOneIcon.innerText = "🍱";
        panelOneTitle.innerText = "壹、澎湃的料";
        panelOneTitle.className = "text-base font-bold text-[#1E5136]";
        tipText.innerHTML = `你可以簡單 <strong class="text-[#1E5136]">[- / +]</strong> 放入配料，並直接在下方粽葉上“任意調整和旋轉”它的位置唷！`;
        canvasHint.innerText = "👉 請點選上方配料 [ + ] 放入肉粽葉中！";
        canvasHint.className = "absolute top-3 left-3 right-3 bg-white/95 backdrop-blur-sm border border-emerald-100 px-3 py-1.5 rounded-full text-center text-[10px] text-emerald-800 shadow-sm z-30 pointer-events-none transition-opacity duration-300";
        finishText.innerText = "我綁好矣！";
        finishIcon.innerText = "🍙";
        speechSection.className = "bg-[#1E5136] rounded-2xl p-4 border-2 border-[#123623] text-white screenshot-card-shadow transition-all duration-400";
        speechSub.innerText = "（用台語介紹肉粽內底有啥）";
        speechBox.className = "bg-[#17432C] rounded-2xl p-3.5 flex items-center space-x-4 border border-[#123522] transition-all duration-400";
        speechPrefix.innerText = "這是我的肉粽，我的肉粽內底有：";
        speechPrefix.className = "text-[10px] text-emerald-300 font-bold tracking-wider mb-0.5";
        wrappedBadge.className = "mt-3 bg-[#729A82] text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm flex items-center space-x-1 transition-all duration-400";
        wrappedBadgeText.innerText = "縛好矣！芳貢貢！";

        // Tab Activation
        tabZongzi.className = "flex-1 py-2 text-center font-black text-xs md:text-sm rounded-t-xl transition-all duration-300 bg-[#1E5136] text-[#FDF03A] border-b-2 border-[#FDF03A]";
        tabIce.className = "flex-1 py-2 text-center font-black text-xs md:text-sm rounded-t-xl transition-all duration-300 bg-[#123623] text-slate-400 hover:text-white";

        // Load Canvas Graphics
        loadZongziGraphics();

      } else {
        // Shaved Ice Mode styling (Ocean Cyan/Sky Blue)
        document.body.classList.add('shaved-ice-mode');
        mainContainer.className = "w-full max-w-md bg-[#F4F9FC] rounded-[28px] overflow-hidden border-4 border-[#0284C7] shadow-2xl flex flex-col pb-6 transition-all duration-400";
        headerBar.className = "bg-[#0284C7] py-3.5 px-4 flex items-center justify-center space-x-2 text-white transition-all duration-400";
        headerIcon.innerText = "🍧";
        headerTitle.innerText = "咱來礤冰！";
        panelOneIcon.innerText = "🍧";
        panelOneTitle.innerText = "壹、澎湃的料";
        panelOneTitle.className = "text-base font-bold text-[#0284C7]";
        tipText.innerHTML = `你可以簡單 <strong class="text-[#0284C7]">[- / +]</strong> 放入料，並直接在下方礤冰上“任意調整和旋轉”它的位置唷！`;
        canvasHint.innerText = "👉 請點選上方配料 [ + ] 放入礤冰山丘上！";
        canvasHint.className = "absolute top-3 left-3 right-3 bg-white/95 backdrop-blur-sm border border-sky-100 px-3 py-1.5 rounded-full text-center text-[10px] text-sky-800 shadow-sm z-30 pointer-events-none transition-opacity duration-300";
        finishText.innerText = "我礤好矣！";
        finishIcon.innerText = "🍧";
        speechSection.className = "bg-[#0284C7] rounded-2xl p-4 border-2 border-[#0369A1] text-white screenshot-card-shadow transition-all duration-400";
        speechSub.innerText = "（用台語介紹礤冰內底有啥）";
        speechBox.className = "bg-[#0C4A6E] rounded-2xl p-3.5 flex items-center space-x-4 border border-[#082F49] transition-all duration-400";
        speechPrefix.innerText = "這是我礤的礤冰，我礤的礤冰內底有：";
        speechPrefix.className = "text-[10px] text-sky-300 font-bold tracking-wider mb-0.5";
        wrappedBadge.className = "mt-3 bg-[#0284C7] text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-sm flex items-center space-x-1 transition-all duration-400";
        wrappedBadgeText.innerText = "淋煉乳矣！甜粅粅！";

        // Tab Activation
        tabIce.className = "flex-1 py-2 text-center font-black text-xs md:text-sm rounded-t-xl transition-all duration-300 bg-[#0284C7] text-[#FDF03A] border-b-2 border-[#FDF03A]";
        tabZongzi.className = "flex-1 py-2 text-center font-black text-xs md:text-sm rounded-t-xl transition-all duration-300 bg-[#0C4A6E] text-sky-200 hover:text-white";

        // Load Canvas Graphics
        loadShavedIceGraphics();
      }

      // Reset DOM structures
      wrappedState.classList.add('hidden');
      unwrappedState.classList.remove('hidden', 'opacity-0', 'scale-75');
      canvasHint.style.opacity = '1';

      renderIngredients();
      updateSentenceLayout();
    }

    // 4. GRAPHIC GENERATORS
    function loadZongziGraphics() {
      // Unwrapped Leaf
      canvasBgGraphic.innerHTML = `
        <svg class="w-52 h-52 drop-shadow-md animate-fade-in" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 110 C 40 160, 160 160, 185 110 C 160 60, 110 30, 100 20 C 90 30, 40 60, 15 110 Z" fill="#2d6e49"/>
          <path d="M15 110 C 10 90, 40 40, 100 20 C 80 70, 45 100, 15 110 Z" fill="#1b5232"/>
          <path d="M185 110 C 190 90, 160 40, 100 20 C 120 70, 155 100, 185 110 Z" fill="#23603b"/>
          <path d="M100 20 Q 100 100 100 150" stroke="#123b20" stroke-width="1.5"/>
          <path d="M55 110 C 55 80, 145 80, 145 110 C 145 135, 55 135, 55 110 Z" fill="#FAF8F0" stroke="#E5DEC9" stroke-width="2"/>
          <ellipse cx="80" cy="105" rx="5" ry="3" fill="#FFFFFF" transform="rotate(20 80 105)" />

      const ing = listToSearch.find(i => i.id === id);

    function removeEmojiFromCanvas(ingId) {
      const idx = canvasItems.map(x => x.ingId).lastIndexOf(ingId);
      if (idx !== -1) {

    function bindItemDragAndRotation(item) {
      const el = item.dom;
      let dragging = false;
      let startX, startY;
      let itemX, itemY;

      el.addEventListener('pointerdown', (e) => {
        if (isWrapped) return;
        if (e.target.closest('.btn-rotate') || e.target.closest('.btn-delete')) return;

        dragging = true;
        el.setPointerCapture(e.pointerId);
        
        startX = e.clientX;
        startY = e.clientY;
        itemX = parseFloat(el.style.left);
        itemY = parseFloat(el.style.top);
        
        e.stopPropagation();
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        const bounds = spawnContainer.getBoundingClientRect();
        let nx = itemX + dx;
        let ny = itemY + dy;

        nx = Math.max(0, Math.min(bounds.width - 32, nx));
        ny = Math.max(0, Math.min(bounds.height - 32, ny));

        el.style.left = `${nx}px`;
        el.style.top = `${ny}px`;
        item.x = nx;
        item.y = ny;
      });

      const stopDrag = (e) => {
        if (dragging) {
          dragging = false;
          el.releasePointerCapture(e.pointerId);
        }
      };
      el.addEventListener('pointerup', stopDrag);
      el.addEventListener('pointercancel', stopDrag);

      // Rotation Actions
      const rot = el.querySelector('.btn-rotate');
      let rotating = false;
      let centerAngle = 0;

      rot.addEventListener('pointerdown', (e) => {
        rotating = true;
        rot.setPointerCapture(e.pointerId);

        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        centerAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) - item.angle;
        e.stopPropagation();
      });

      rot.addEventListener('pointermove', (e) => {
        if (!rotating) return;
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const currAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
        let calculated = currAngle - centerAngle;
        if (calculated < 0) calculated += 360;

        item.angle = calculated;
        el.style.transform = `rotate(${calculated}deg)`;
      });

      const stopRot = (e) => {
        if (rotating) {
          rotating = false;
          rot.releasePointerCapture(e.pointerId);
        }
      };
      rot.addEventListener('pointerup', stopRot);
      rot.addEventListener('pointercancel', stopRot);

      // Delete Node Trigger
      const del = el.querySelector('.btn-delete');
      del.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        el.remove();
        canvasItems = canvasItems.filter(x => x.id !== item.id);
        
        basket[item.ingId] = Math.max(0, (basket[item.ingId] || 1) - 1);
        
        // Force refresh card elements safely
        const qtyLabel = document.getElementById(`qty-${item.ingId}`);
        if (qtyLabel) {
          qtyLabel.innerText = basket[item.ingId];
        }

        if (canvasItems.length === 0) {
          canvasHint.style.opacity = '1';
        }
        updateSentenceLayout();
      });
    }

    // 10. Dynamic Speech Sentence generator matching correct mode semantics
    function updateSentenceLayout() {
      const currentList = currentMode === 'zongzi' ? zongziIngredients : shavedIceIngredients;
      const activeIngredients = currentList.filter(ing => basket[ing.id] > 0);

      if (activeIngredients.length === 0) {
        const hintText = currentMode === 'zongzi' ? "(請點選上方配料 + 放入肉粽裡...)" : "(請點選上方配料 + 放入礤冰裡...)";
        speechSentenceEl.innerHTML = `<span class="text-emerald-300 font-normal opacity-60">${hintText}</span>`;
        return;
      }

      let parsedElements = activeIngredients.map(ing => {
        const count = basket[ing.id];
        return `${ing.name} ${count > 1 ? `${count}個` : '1個'}`;
      });

      let formattedOutput = "";
      if (parsedElements.length === 1) {
        formattedOutput = parsedElements[0];
      } else {
        const lastElement = parsedElements.pop();
        formattedOutput = parsedElements.join('、') + "，閣有 " + lastElement;
      }

      speechSentenceEl.innerText = formattedOutput + "！";
    }

    // ==========================================
    // 11. 100% STANDARDIZED REAL TAIWANESE (NAN) SPEECH STREAMER (GTX Engine)
    // ==========================================
    function playTaigiTTS(phraseText, buttonIconElement) {
      if (!buttonIconElement) return;

      unlockAudioPipeline();

      // Normalize colloquial Southern Min (nan) terms for flawless Google TTS streaming
      let cleanText = phraseText
        .replace(/塗豆/g, "土豆")     // thôo-tāu
        .replace(/滷肉/g, "魯肉")     // lóo-bah
        .replace(/粉粿/g, "粉粿")     // hún-kué
        .replace(/甜粅粅/g, "甜物物"); // tinn-bu̍t-bu̍t

      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }

      // Use GTX client parameter to bypass CORS security constraints safely inside iframe sandboxes
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=nan&client=gtx&q=${encodeURIComponent(cleanText)}`;

      // Update badge UI to indicate Google Cloud engine status
      engineBadge.innerText = "🔊 雲端台語 (Google)";
      engineBadge.className = currentMode === 'zongzi'
        ? "bg-[#F2DF3A] text-[#1E5136] text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm"
        : "bg-[#FDF03A] text-[#0284C7] text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm";

      // Trigger standard bounce animation
      const originalClass = buttonIconElement.className;
      buttonIconElement.className = "fa-solid fa-volume-high text-lg text-emerald-800 animate-bounce";

      activeAudio = new Audio();
      activeAudio.referrerPolicy = "no-referrer"; // Strips Referer header to completely prevent 403 blocks!
      activeAudio.src = url;

      activeAudio.onended = () => {
        buttonIconElement.className = originalClass;
      };

      activeAudio.onerror = () => {
        console.warn("Google Cloud blocked or offline. Switching dynamically to Web Speech API fallback...");
        buttonIconElement.className = originalClass;
        playNativeDeviceSpeechSynthesis(phraseText, buttonIconElement);
      };

      activeAudio.play().catch(err => {
        console.warn("User gesture trigger block. Transitioning to fallback synthesis:", err);
        buttonIconElement.className = originalClass;
        playNativeDeviceSpeechSynthesis(phraseText, buttonIconElement);
      });
    }

    // Local Synthesizer Fallback utilizing standard Taiwanese accents
    function playNativeDeviceSpeechSynthesis(phraseText, buttonIconElement) {
      if (!('speechSynthesis' in window)) {
        showFloatingToast("🔊 您的裝置不支援語音播放。請點選右上角『在新分頁開啟』！");
        return;
      }

      window.speechSynthesis.cancel();

      // Update Badge UI to inform Local Synthesizer is active
      engineBadge.innerText = "🔊 本地合成 (Web Speech)";
      engineBadge.className = "bg-amber-100 text-amber-800 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm";

      const localizedPhoneticPhrase = phraseText
        .replace(/卵仁/g, "卵仁, lán-lîn")
        .replace(/香菇/g, "香菇, hiang-gū")
        .replace(/塗豆/g, "花生, thôo-tāu")
        .replace(/滷肉/g, "滷肉, lóo-bah")
        .replace(/閣有/g, "還有")
        .replace(/內底有/g, "裡面有")
        .replace(/芳貢貢/g, "香噴噴")
        .replace(/甜粅粅/g, "甜物物");

      const utterance = new SpeechSynthesisUtterance(localizedPhoneticPhrase);
      utterance.lang = "zh-TW";
      utterance.rate = 0.85;

      const availableVoices = window.speechSynthesis.getVoices();
      const taiwanVoice = availableVoices.find(v => v.lang.includes("zh-TW"));
      if (taiwanVoice) {
        utterance.voice = taiwanVoice;
      }

      const originalClass = buttonIconElement.className;

      utterance.onstart = () => {
        buttonIconElement.className = "fa-solid fa-volume-high text-lg text-emerald-800 animate-bounce";
      };

      utterance.onend = () => {
        buttonIconElement.className = originalClass;
      };

      utterance.onerror = () => {
        buttonIconElement.className = originalClass;
      };

      window.speechSynthesis.speak(utterance);
    }

    // Precise DOM target speaker trigger
    function playSingleIngredientVoice(ingredientName, triggerElement) {
      if (!triggerElement) return;
      const icon = triggerElement.querySelector('i');
      playTaigiTTS(ingredientName, icon || micIcon);
    }

    // Aggregate speech builder matching Mode semantics
    function playFullSpeechSentence() {
      const currentList = currentMode === 'zongzi' ? zongziIngredients : shavedIceIngredients;
      const activeIngredients = currentList.filter(ing => basket[ing.id] > 0);

      if (activeIngredients.length === 0) {
        const msg = currentMode === 'zongzi' ? "💡 您的肉粽目前沒有配料，請先點選配料！" : "💡 您的礤冰目前沒有好料，請先點選配料！";
        showFloatingToast(msg);
        return;
      }

      let spokenSentence = currentMode === 'zongzi' ? "這是我縛的肉粽，內底有：" : "這是我礤的礤冰，內底有：";
      
      const namesList = activeIngredients.map(ing => {
        const count = basket[ing.id];
        return `${ing.name} ${count > 1 ? `${count}個` : '一個'}`;
      });
      
      if (namesList.length === 1) {
        spokenSentence += namesList[0];
      } else {
        const finalItem = namesList.pop();
        spokenSentence += namesList.join('、') + "，閣有 " + finalItem;
      }

      if (currentMode === 'zongzi') {
        spokenSentence += isWrapped ? "。已經縛好矣，芳貢貢喔！" : "。配料誠澎湃，欲準備來縛矣！";
      } else {
        spokenSentence += isWrapped ? "。淋煉乳矣，甜粅粅，真好食喔！" : "。配料誠豐盛，欲準備來淋煉乳矣！";
      }

      playTaigiTTS(spokenSentence, micIcon);
    }

    // Premium Compliancy Floating Toast
    function showFloatingToast(msg) {
      const activeToast = document.getElementById('floating-toast');
      if (activeToast) activeToast.remove();

      const toast = document.createElement('div');
      toast.id = 'floating-toast';
      toast.className = "fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#1A2332]/95 text-[#E2E8F0] text-xs font-semibold py-3 px-6 rounded-2xl shadow-2xl z-50 transition-all duration-300 transform translate-y-10 opacity-0 flex items-center space-x-2 border border-slate-700/50 w-11/12 max-w-xs text-center justify-center";
      toast.innerHTML = `<span>🔔</span> <span>${msg}</span>`;

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      }, 50);

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
