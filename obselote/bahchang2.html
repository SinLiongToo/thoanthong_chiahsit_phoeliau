
<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <!-- Strips Referrer to bypass Google TTS API 403 Forbidden inside Iframe / Shared Folders -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>咱來縛肉粽！- 台灣傳統肉粽互動體驗</title>

  <style>

<body class="min-h-screen py-4 px-3 flex flex-col items-center justify-start select-none">

    <!-- HEADER BAR: Dark Green with Zongzi icon -->

    <!-- MAIN SCROLLABLE BODY -->
    <div class="px-3 pt-4 space-y-4 flex-1">
      
      <!-- PART 1: INGREDIENTS SELECTOR (壹、澎湃的料) -->
      <section class="bg-[#FFFDF9] rounded-2xl p-4 screenshot-card-shadow relative">
        <div class="flex items-center space-x-2 mb-3">
          <span class="text-lg">🍱</span>
          <h2 class="text-base font-bold text-[#1E5136]">壹、澎湃的料</h2>
          <span class="bg-[#F2DF3A] text-[#1E5136] text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm" id="engine-badge">

        </div>

        <!-- Grid matching the visual layout of screenshot 1 -->

        </div>

        <!-- Yellow banner at the bottom of ingredients -->
        <div class="bg-[#FFFDEB] border border-[#FDEAA8] rounded-xl p-2.5 text-[11px] text-[#8B6B3F] mt-3.5 flex items-start space-x-1.5 leading-relaxed">
          <span class="text-sm mt-0.5">💡</span>
          <p>
            你可以簡單 <strong class="text-[#1E5136]">[- / +]</strong> 放入配料，並直接在下方粽葉上“任意調整和旋轉”它的位置唷！

      <!-- PART 2: THE PLAYGROUND CANVAS -->
      <section class="bg-white rounded-2xl p-4 screenshot-card-shadow relative flex flex-col">
        
        <!-- Canvas Frame -->
        <div id="canvas-area" class="w-full h-64 bg-gradient-to-b from-slate-50 to-emerald-50/20 rounded-xl border border-dashed border-[#D6C7AE] relative overflow-hidden flex items-center justify-center">

          <!-- UNWRAPPED STATE (Bamboo Leaf with Rice) -->
          <div id="unwrapped-state" class="relative w-full h-full flex items-center justify-center transition-all duration-300">
            <!-- Bamboo Leaf Graphic -->
            <svg class="w-52 h-52 drop-shadow-md" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 110 C 40 160, 160 160, 185 110 C 160 60, 110 30, 100 20 C 90 30, 40 60, 15 110 Z" fill="#2d6e49"/>

        <!-- Buttons Block: Styled exactly like screenshot 2 -->

            <span class="text-base">🔀</span>

          <!-- Finish/Wrap Button -->
          <button id="btn-finish" class="bg-[#F36F21] hover:bg-[#E25E12] text-white font-black py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-md active:scale-95 transition-all">

      </section>

      <!-- PART 3: SPEECH AREA (參、講看覓咧！) -->
      <section class="bg-[#1E5136] rounded-2xl p-4 border-2 border-[#123623] text-white screenshot-card-shadow">
        
        <!-- Header -->
        <div class="flex items-center space-x-2 mb-3">
          <span class="text-lg">🗣️</span>
          <h2 class="text-sm font-black text-white">參、講看覓咧！<span class="text-[11px] text-emerald-200 font-normal ml-1">(用台語介紹肉粽內底有啥)</span></h2>
        </div>

        <!-- Speech Frame Container (Dark Green Pill Box) -->
        <div class="bg-[#17432C] rounded-2xl p-3.5 flex items-center space-x-4 border border-[#123522]">
          
          <!-- Circular Speaker/Microphone Trigger Button -->
          <button id="btn-speak-all" class="w-12 h-12 shrink-0 bg-white hover:bg-emerald-50 text-[#1E5136] rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform relative" title="點擊聆聽台語發音">
            <i class="fa-solid fa-microphone text-lg text-emerald-800" id="mic-icon"></i>
          </button>

          <!-- Speech Text content -->
          <div class="flex-1 min-h-[48px] flex flex-col justify-center">
            <span class="text-[10px] text-emerald-300 font-bold tracking-wider mb-0.5">這是我的肉粽，我的肉粽內底有：</span>
            <!-- Bright Yellow Text from Screenshot 2 -->
            <div id="speech-sentence" class="text-sm md:text-base font-black text-[#FDF03A] tracking-wide leading-relaxed">
              (請點選上方配料 + 放入肉粽裡...)

  <div class="text-[10px] text-slate-400 mt-4 text-center select-none font-medium">
    咱來縛肉粽！ | 採用 100% 正統台語原生發音技術 (`nan-TW`)
  </div>

  <!-- APPLICATION CODE LOGIC -->
  <script>
    // Ingredients Pronunciation Registry
    const ingredientsData = [
      { id: 'yolk', name: '卵仁', sub: 'nn̂g-jîn', emoji: '🟡' },
      { id: 'mushroom', name: '香菇', sub: 'hiunn-koo', emoji: '🍄' },
      { id: 'peanut', name: '塗豆', sub: 'thôo-tāu', emoji: '🥜' },
      { id: 'pork', name: '滷肉', sub: 'lóo-bah', emoji: '🥓' },
      { id: 'chestnut', name: '栗子', sub: 'la̍t-tsí', emoji: '🌰' },
      { id: 'shrimp', name: '蝦米', sub: 'hê-bí', emoji: '🦐' },
      { id: 'squid', name: '魷魚', sub: 'jiû-hî', emoji: '🦑' },
      { id: 'salted_egg', name: '鹹蛋', sub: 'kiâm-nn̂g', emoji: '🍳' }
    ];

    // State Variables
    let basket = {}; 
    let canvasItems = []; 
    let isWrapped = false;
    let activeAudio = null;   
    let isAudioUnlocked = false;

    // DOM References
    const gridEl = document.getElementById('ingredients-grid');
    const spawnContainer = document.getElementById('spawning-container');
    const unwrappedState = document.getElementById('unwrapped-state');
    const wrappedState = document.getElementById('wrapped-state');
    const canvasHint = document.getElementById('canvas-hint');
    const speechSentenceEl = document.getElementById('speech-sentence');
    const engineBadge = document.getElementById('engine-badge');
    
    // Action Controllers
    const btnRestart = document.getElementById('btn-restart');
    const btnFinish = document.getElementById('btn-finish');
    const finishText = document.getElementById('finish-text');
    const btnSpeakAll = document.getElementById('btn-speak-all');
    const micIcon = document.getElementById('mic-icon');

    // 1. Initial Launch
    function init() {
      renderIngredients();
      updateSentenceLayout();

      btnRestart.addEventListener('click', restartAction);
      btnFinish.addEventListener('click', toggleWrapState);
      
      btnSpeakAll.addEventListener('click', () => {
        unlockAudioPipeline();
        playFullSpeechSentence();
      });

      // Unlock on first tap
      window.addEventListener('pointerdown', unlockAudioPipeline, { passive: true });
    }

    // Unblocks programmatic audio playing for iOS
    function unlockAudioPipeline() {
      if (isAudioUnlocked) return;
      try {
        const dummy = new Audio();
        dummy.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
        dummy.play().then(() => {
          isAudioUnlocked = true;
          console.log("Audio unlocked successfully");
        }).catch(() => {});
      } catch (e) {}
    }

    // 2. Render Panel Item selectors (Screenshot 1 styling)
    function renderIngredients() {
      gridEl.innerHTML = '';
      ingredientsData.forEach(ing => {
        const count = basket[ing.id] || 0;
        
        const card = document.createElement('div');
        card.className = "bg-white p-2.5 rounded-xl border border-[#F3EAD3] flex flex-col items-center select-none relative shadow-sm";
        card.innerHTML = `
          <div class="text-3xl mb-1 filter drop-shadow-sm transform scale-105 pointer-events-none">${ing.emoji}</div>
          
          <div class="text-center mb-2">
            <span class="block text-xs font-extrabold text-slate-800 cursor-pointer hover:text-emerald-700" onclick="playSingleIngredientVoice('${ing.name}', this)">
              ${ing.name} <i class="fa-solid fa-volume-high text-[9px] text-slate-400 ml-0.5"></i>
            </span>
            <span class="block text-[9px] text-emerald-600 font-semibold font-mono bg-emerald-50 px-1.5 py-0.5 rounded-full mt-0.5">${ing.sub}</span>
          </div>

          <div class="flex items-center w-full justify-between bg-slate-50 border border-slate-150 rounded-lg p-0.5">
            <button onclick="changeIngredientCount('${ing.id}', -1)" class="w-6 h-6 bg-[#FFEBEB] text-[#FF5B5B] hover:bg-red-100 font-extrabold rounded-md flex items-center justify-center transition-all focus:outline-none text-xs">-</button>
            <span id="qty-${ing.id}" class="text-xs font-black text-slate-700 w-5 text-center">${count}</span>
            <button onclick="changeIngredientCount('${ing.id}', 1)" class="w-6 h-6 bg-[#E8F8F5] text-[#1ABC9C] hover:bg-emerald-100 font-extrabold rounded-md flex items-center justify-center transition-all focus:outline-none text-xs">+</button>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    // 3. Counter Adjustment Logic
    window.changeIngredientCount = function(id, delta) {
      if (isWrapped) {
        showFloatingToast("⚠️ 綁好肉粽囉！請先點「重新來過」再放入別的料。");
        return;
      }

      unlockAudioPipeline();

      const ing = ingredientsData.find(i => i.id === id);
      const current = basket[id] || 0;
      const next = Math.max(0, current + delta);

      basket[id] = next;
      document.getElementById(`qty-${id}`).innerText = next;

      if (delta > 0) {
        spawnEmojiInCanvas(ing);
        // Instant domestic locator pointer
        const countLabel = document.getElementById(`qty-${id}`);
        const cardNode = countLabel ? countLabel.closest('.bg-white') : null;
        const spanNode = cardNode ? cardNode.querySelector('span') : null;
        playSingleIngredientVoice(ing.name, spanNode);
      } else if (delta < 0) {
        removeEmojiFromCanvas(id);
      }

      updateSentenceLayout();
    };

    // 4. Interactive Draggable System inside Bamboo Canvas
    function spawnEmojiInCanvas(ing) {
      canvasHint.style.opacity = '0';

      const el = document.createElement('div');
      const uniqueId = 'canvas-item-' + Date.now() + Math.random().toString(36).substr(2, 3);
      el.id = uniqueId;
      el.className = "drag-item absolute cursor-grab select-none active:cursor-grabbing z-20 group p-1";

      const bounds = spawnContainer.getBoundingClientRect();
      const randX = (bounds.width / 2) + (Math.random() * 60 - 30) - 16;
      const randY = (bounds.height / 2) + (Math.random() * 60 - 30) - 16;
      const randAngle = Math.floor(Math.random() * 360);

      el.style.left = `${randX}px`;
      el.style.top = `${randY}px`;
      el.style.transform = `rotate(${randAngle}deg)`;

      el.innerHTML = `
        <div class="text-3xl pointer-events-none filter drop-shadow transition-transform hover:scale-115">${ing.emoji}</div>
        <div class="control-ring opacity-0 group-hover:opacity-100 absolute -top-3 -left-3 w-12 h-12 border border-dashed border-emerald-600 rounded-full pointer-events-none flex items-center justify-between">
          <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-4.5 h-4.5 bg-emerald-600 rounded-full flex items-center justify-center text-white text-[8px] cursor-pointer pointer-events-auto shadow btn-rotate">
            <i class="fa-solid fa-sync"></i>
          </div>
          <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-4.5 h-4.5 bg-red-500 rounded-full flex items-center justify-center text-white text-[8px] cursor-pointer pointer-events-auto shadow btn-delete">
            <i class="fa-solid fa-trash-can"></i>
          </div>
        </div>
      `;

      spawnContainer.appendChild(el);

      const itemData = {
        id: uniqueId,
        ingId: ing.id,
        x: randX,
        y: randY,
        angle: randAngle,
        dom: el
      };
      canvasItems.push(itemData);

      bindItemDragAndRotation(itemData);
    }

    function removeEmojiFromCanvas(ingId) {
      const idx = canvasItems.map(x => x.ingId).lastIndexOf(ingId);
      if (idx !== -1) {
        canvasItems[idx].dom.remove();
        canvasItems.splice(idx, 1);
      }
      if (canvasItems.length === 0) {
        canvasHint.style.opacity = '1';
      }
    }

    function bindItemDragAndRotation(item) {
      const el = item.dom;
      let dragging = false;
      let startX, startY;
      let itemX, itemY;

      el.addEventListener('pointerdown', (e) => {
        if (isWrapped) return;
        if (e.target.closest('.btn-rotate') || e.target.closest('.btn-delete')) return;

        dragging = true;
        el.setPointerCapture(e.pointerId);
        
        startX = e.clientX;
        startY = e.clientY;
        itemX = parseFloat(el.style.left);
        itemY = parseFloat(el.style.top);
        
        e.stopPropagation();
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        const bounds = spawnContainer.getBoundingClientRect();
        let nx = itemX + dx;
        let ny = itemY + dy;

        nx = Math.max(0, Math.min(bounds.width - 32, nx));
        ny = Math.max(0, Math.min(bounds.height - 32, ny));

        el.style.left = `${nx}px`;
        el.style.top = `${ny}px`;
        item.x = nx;
        item.y = ny;
      });

      const stopDrag = (e) => {
        if (dragging) {
          dragging = false;
          el.releasePointerCapture(e.pointerId);
        }
      };
      el.addEventListener('pointerup', stopDrag);
      el.addEventListener('pointercancel', stopDrag);

      // Rotation Actions
      const rot = el.querySelector('.btn-rotate');
      let rotating = false;
      let centerAngle = 0;

      rot.addEventListener('pointerdown', (e) => {
        rotating = true;
        rot.setPointerCapture(e.pointerId);

        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        centerAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) - item.angle;
        e.stopPropagation();
      });

      rot.addEventListener('pointermove', (e) => {
        if (!rotating) return;
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const currAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
        let calculated = currAngle - centerAngle;
        if (calculated < 0) calculated += 360;

        item.angle = calculated;
        el.style.transform = `rotate(${calculated}deg)`;
      });

      const stopRot = (e) => {
        if (rotating) {
          rotating = false;
          rot.releasePointerCapture(e.pointerId);
        }
      };
      rot.addEventListener('pointerup', stopRot);
      rot.addEventListener('pointercancel', stopRot);

      // Delete Node Trigger
      const del = el.querySelector('.btn-delete');
      del.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        el.remove();
        canvasItems = canvasItems.filter(x => x.id !== item.id);
        
        basket[item.ingId] = Math.max(0, (basket[item.ingId] || 1) - 1);
        document.getElementById(`qty-${item.ingId}`).innerText = basket[item.ingId];

        if (canvasItems.length === 0) {
          canvasHint.style.opacity = '1';
        }
        updateSentenceLayout();
      });
    }

    // 5. Wrap / Unwrap Transition
    function toggleWrapState() {
      if (canvasItems.length === 0) {
        showFloatingToast("⚠️ 你的肉粽內底空空，請先加入配料喔！");
        return;
      }

      isWrapped = !isWrapped;

      if (isWrapped) {
        unwrappedState.classList.add('opacity-0', 'scale-75');
        setTimeout(() => {
          unwrappedState.classList.add('hidden');
          wrappedState.classList.remove('hidden');
          wrappedState.classList.add('opacity-100', 'scale-100');

          confetti({
            particleCount: 80,
            spread: 50,
            origin: { y: 0.75 },
            colors: ['#2d6e49', '#FAF2E5', '#1b5232', '#F2DF3A', '#F36F21']
          });
        }, 150);

        finishText.innerText = "解開肉粽";
        showFloatingToast("🎉 肉粽綁好了！香味撲鼻！");
      } else {
        wrappedState.classList.add('opacity-0', 'scale-75');
        setTimeout(() => {
          wrappedState.classList.add('hidden');
          unwrappedState.classList.remove('hidden');
          unwrappedState.classList.add('opacity-100', 'scale-100');
        }, 150);
        finishText.innerText = "我綁好矣！";
      }
      updateSentenceLayout();
    }

    // 6. Restart/Clear Action
    function restartAction() {
      basket = {};
      canvasItems = [];
      spawnContainer.innerHTML = '';
      isWrapped = false;

      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }

      ingredientsData.forEach(ing => {
        document.getElementById(`qty-${ing.id}`).innerText = 0;
      });

      wrappedState.classList.add('hidden');
      unwrappedState.classList.remove('hidden', 'opacity-0', 'scale-75');
      canvasHint.style.opacity = '1';

      finishText.innerText = "我綁好矣！";
      updateSentenceLayout();
      showFloatingToast("🔄 已清理，包新的一顆肉粽！");
    }

    // 7. Dynamic Speech Sentence Layout generator (Exactly like Screenshot 2)
    function updateSentenceLayout() {
      const activeIngredients = ingredientsData.filter(ing => basket[ing.id] > 0);

      if (activeIngredients.length === 0) {
        speechSentenceEl.innerHTML = `<span class="text-emerald-300 font-normal">(請點選上方配料 + 放入肉粽裡...)</span>`;
        return;
      }

      let parsedElements = activeIngredients.map(ing => {
        const count = basket[ing.id];
        return `${ing.name} ${count > 1 ? `${count}個` : '1個'}`;
      });

      let formattedOutput = "";
      if (parsedElements.length === 1) {
        formattedOutput = parsedElements[0];
      } else {
        const lastElement = parsedElements.pop();
        formattedOutput = parsedElements.join('、') + "，閣有 " + lastElement;
      }

      speechSentenceEl.innerText = formattedOutput + "！";
    }

    // ==========================================
    // 8. 100% CORRECT & ROBUST TAIWANESE (NAN) SPEECH ENGINE
    // ==========================================

    function playTaigiTTS(phraseText, buttonIconElement) {
      if (!buttonIconElement) return;

      unlockAudioPipeline();

      // Standardize terms for Google's highly accurate Southern Min (nan) engine
      // This maps modern or literary terms to natural colloquial Hanji
      let cleanText = phraseText
        .replace(/塗豆/g, "土豆") // Google nan reads 土豆 as thôo-tāu
        .replace(/滷肉/g, "魯肉"); // Google nan reads 魯肉 as lóo-bah

      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }

      // Use GTX endpoint to completely bypass CORS / iframe sandboxing restrictions safely
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=nan&client=gtx&q=${encodeURIComponent(cleanText)}`;

      // Update badge UI to indicate Google Cloud
      engineBadge.innerText = "🔊 雲端台語 (Google)";
      engineBadge.className = "bg-[#F2DF3A] text-[#1E5136] text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm";

      // Add bounce state
      const originalClass = buttonIconElement.className;
      buttonIconElement.className = "fa-solid fa-volume-high text-lg text-emerald-800 animate-bounce";

      activeAudio = new Audio();
      activeAudio.referrerPolicy = "no-referrer"; // Bypasses 403 blocks inside Gemini sandboxed preview
      activeAudio.src = url;

      activeAudio.onended = () => {
        buttonIconElement.className = originalClass;
      };

      activeAudio.onerror = () => {
        console.warn("Google TTS blocked or offline. Falling back seamlessly to native browser Synthesis...");
        buttonIconElement.className = originalClass;
        playNativeSpeechSynthesisFallback(phraseText, buttonIconElement);
      };

      activeAudio.play().catch(err => {
        console.warn("Autoplay block or network error, applying local engine fallback:", err);
        buttonIconElement.className = originalClass;
        playNativeSpeechSynthesisFallback(phraseText, buttonIconElement);
      });
    }

    // High quality offline fallback using localized Taiwanese accents
    function playNativeSpeechSynthesisFallback(phraseText, buttonIconElement) {
      if (!('speechSynthesis' in window)) {
        showFloatingToast("🔊 您的裝置不支援語音播放，請點選右上角『在新分頁開啟』。");
        return;
      }

      window.speechSynthesis.cancel();

      // Update Badge UI to inform Local Synthesizer is active
      engineBadge.innerText = "🔊 本地合成 (Web Speech)";
      engineBadge.className = "bg-amber-100 text-amber-800 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-sm";

      // Reformat terms into native zh-TW phonetic equivalents for highly intelligible domestic synthesis
      const localizedPhoneticPhrase = phraseText
        .replace(/卵仁/g, "卵仁, lán-lîn")
        .replace(/香菇/g, "香菇, hiang-gū")
        .replace(/塗豆/g, "花生, thôo-tāu")
        .replace(/滷肉/g, "滷肉, lóo-bah")
        .replace(/閣有/g, "還有")
        .replace(/內底有/g, "裡面有")
        .replace(/芳貢貢/g, "香噴噴");

      const utterance = new SpeechSynthesisUtterance(localizedPhoneticPhrase);
      utterance.lang = "zh-TW";
      utterance.rate = 0.85;

      const availableVoices = window.speechSynthesis.getVoices();
      const taiwanVoice = availableVoices.find(v => v.lang.includes("zh-TW"));
      if (taiwanVoice) {
        utterance.voice = taiwanVoice;
      }

      const originalClass = buttonIconElement.className;

      utterance.onstart = () => {
        buttonIconElement.className = "fa-solid fa-volume-high text-lg text-emerald-800 animate-bounce";
      };

      utterance.onend = () => {
        buttonIconElement.className = originalClass;
      };

      utterance.onerror = () => {
        buttonIconElement.className = originalClass;
      };

      window.speechSynthesis.speak(utterance);
    }

    // Precise target speaker voice trigger
    function playSingleIngredientVoice(ingredientName, triggerElement) {
      if (!triggerElement) return;
      const icon = triggerElement.querySelector('i');
      playTaigiTTS(ingredientName, icon || micIcon);
    }

    // Full voice reading phrase
    function playFullSpeechSentence() {
      const activeIngredients = ingredientsData.filter(ing => basket[ing.id] > 0);
      if (activeIngredients.length === 0) {
        showFloatingToast("💡 您的肉粽目前沒有配料，請先點擊上方加入配料！");
        return;
      }

      let spokenSentence = "這是我縛的肉粽，內底有：";
      const namesList = activeIngredients.map(ing => {
        const count = basket[ing.id];
        return `${ing.name} ${count > 1 ? `${count}個` : '一個'}`;
      });
      
      if (namesList.length === 1) {
        spokenSentence += namesList[0];
      } else {
        const finalItem = namesList.pop();
        spokenSentence += namesList.join('、') + "，閣有 " + finalItem;
      }
      spokenSentence += isWrapped ? "。已經縛好矣，芳貢貢喔！" : "。配料誠澎湃，欲準備來縛矣！";

      playTaigiTTS(spokenSentence, micIcon);
    }

    // Sandbox Compliant Floating Toast
    function showFloatingToast(msg) {
      const activeToast = document.getElementById('floating-toast');
      if (activeToast) activeToast.remove();

      const toast = document.createElement('div');
      toast.id = 'floating-toast';
      toast.className = "fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#1A2332]/95 text-[#E2E8F0] text-xs font-semibold py-3 px-6 rounded-2xl shadow-2xl z-50 transition-all duration-300 transform translate-y-10 opacity-0 flex items-center space-x-2 border border-slate-700/50 w-11/12 max-w-xs text-center justify-center";
      toast.innerHTML = `<span>🔔</span> <span>${msg}</span>`;

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      }, 50);

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
